services:
  - type: web
    name: deeptrace-api
    runtime: node
    rootDir: .
    buildCommand: |
      pip install opencv-python-headless pillow numpy scipy scikit-image
      cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_BIN
        value: python3
      - key: PYTHON_SCRIPT_PATH
        value: ../deepfake_detector.py
      - key: DETECTOR_OUTPUT
        value: ./detector_output
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app